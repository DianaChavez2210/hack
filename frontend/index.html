<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthSignal LATAM — Panel de Triaje Clínico y Linaje de Evidencia</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            critical: '#ef4444',
            high: '#f97316',
            medium: '#eab308',
            low: '#10b981'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.06); }
    .glass-card:hover { border-color: rgba(59, 130, 246, 0.4); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="antialiased min-h-screen selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const API_BASE = "http://localhost:8000/api/v1";

    // Mock Fallback Data in case FastAPI Backend is offline
    const MOCK_PATIENTS = [
      { patient_id: "PAT-0001", age_years: 68, sex_at_birth: "MALE", care_program: "HOSPITAL_OBSERVATION", risk_score: 0.92, priority_level: "CRITICAL", status: "CONNECTED", facility_id: "FAC-01" },
      { patient_id: "PAT-0042", age_years: 74, sex_at_birth: "FEMALE", care_program: "HOME_MONITORING", risk_score: 0.86, priority_level: "CRITICAL", status: "CONNECTED", facility_id: "FAC-02" },
      { patient_id: "PAT-0108", age_years: 59, sex_at_birth: "MALE", care_program: "HOME_MONITORING", risk_score: 0.74, priority_level: "HIGH", status: "CONNECTED", facility_id: "FAC-01" },
      { patient_id: "PAT-0215", age_years: 81, sex_at_birth: "FEMALE", care_program: "HOSPITAL_OBSERVATION", risk_score: 0.68, priority_level: "HIGH", status: "DISCONNECTED", facility_id: "FAC-03" },
      { patient_id: "PAT-0350", age_years: 62, sex_at_birth: "MALE", care_program: "HOME_MONITORING", risk_score: 0.48, priority_level: "MEDIUM", status: "CONNECTED", facility_id: "FAC-01" },
      { patient_id: "PAT-0412", age_years: 55, sex_at_birth: "FEMALE", care_program: "HOME_MONITORING", risk_score: 0.22, priority_level: "LOW", status: "CONNECTED", facility_id: "FAC-02" },
    ];

    const MOCK_TECHNICAL_ALERTS = [
      { alert_id: "ALT-HW-0001", patient_id: "PAT-0215", device_id: "DEV-00012", alert_type: "LOW_SIGNAL_QUALITY", severity: "HIGH", timestamp: "2026-07-10 11:45:00", message: "Monitor DEV-00012 con SQI = 0.68 (Posible electrodo suelto)", signal_quality_index: 0.68 },
      { alert_id: "ALT-NET-0002", patient_id: "PAT-0042", device_id: "GW-0004", alert_type: "PACKET_LOSS", severity: "MEDIUM", timestamp: "2026-07-10 11:50:00", message: "Pérdida de paquetes estimada en 28% en Gateway regional FAC-02", packet_loss_estimate: 0.28 },
    ];

    const MOCK_SIGNALS = [
      { signal_id: "SIG-000001", patient_id: "PAT-0001", decision_datetime: "2026-07-10 12:00:00", risk_score: 0.92, priority_level: "CRITICAL", evidence_start: "2026-07-09 12:00:00", evidence_end: "2026-07-10 12:00:00", explanation: "Prioridad CRITICAL para el paciente PAT-0001. Hallazgos principales: Frecuencia Cardíaca alterada (128 bpm), Saturación de Oxígeno alterada (88%). Hallazgos de soporte: Frecuencia Respiratoria: 24 bpm. Contexto: estado SLEEP. Calidad de datos: Sin incidencias de red." },
      { signal_id: "SIG-000002", patient_id: "PAT-0042", decision_datetime: "2026-07-10 12:00:00", risk_score: 0.86, priority_level: "CRITICAL", evidence_start: "2026-07-09 12:00:00", evidence_end: "2026-07-10 12:00:00", explanation: "Prioridad CRITICAL para el paciente PAT-0042. Hallazgos principales: Frecuencia Cardíaca alterada (118 bpm). Incidencias de calidad/red: red DELAYED_SYNC (pérdida: 28%)." },
    ];

    const MOCK_EVIDENCE_MAP = {
      "SIG-000001": {
        signal_id: "SIG-000001",
        patient_id: "PAT-0001",
        decision_datetime: "2026-07-10 12:00:00",
        risk_score: 0.92,
        priority_level: "CRITICAL",
        shap_contributions: [
          { feature_name: "vital_SpO2_24h_min", importance: 0.42, description: "Desaturación de oxígeno SpO2 < 90%" },
          { feature_name: "vital_HR_24h_max", importance: 0.35, description: "Taquicardia sostenida HR > 120 bpm" },
          { feature_name: "wearable_sleep_hr_anomaly", importance: 0.18, description: "Frecuencia cardíaca elevada durante estado SLEEP" }
        ],
        evidences: [
          { signal_id: "SIG-000001", source_file: "vital_signs.csv", record_id: "OBS-00004128", variable_code: "SpO2", event_datetime: "2026-07-10 11:30:00", available_datetime: "2026-07-10 11:31:00", evidence_role: "PRIMARY", contribution: 0.85 },
          { signal_id: "SIG-000001", source_file: "vital_signs.csv", record_id: "OBS-00004129", variable_code: "HR", event_datetime: "2026-07-10 11:40:00", available_datetime: "2026-07-10 11:41:00", evidence_role: "PRIMARY", contribution: 0.80 },
          { signal_id: "SIG-000001", source_file: "patient_context.csv", record_id: "CTX-000142", variable_code: "SLEEP_STATE", event_datetime: "2026-07-10 10:00:00", available_datetime: "2026-07-10 10:05:00", evidence_role: "CONTEXT", contribution: 0.25 },
          { signal_id: "SIG-000001", source_file: "vital_signs.csv", record_id: "OBS-00004100", variable_code: "RR", event_datetime: "2026-07-10 11:00:00", available_datetime: "2026-07-10 11:01:00", evidence_role: "SUPPORTING", contribution: 0.15 }
        ]
      }
    };

    function App() {
      const [patients, setPatients] = React.useState(MOCK_PATIENTS);
      const [technicalAlerts, setTechnicalAlerts] = React.useState(MOCK_TECHNICAL_ALERTS);
      const [signals, setSignals] = React.useState(MOCK_SIGNALS);
      const [selectedPatient, setSelectedPatient] = React.useState(null);
      const [selectedSignalId, setSelectedSignalId] = React.useState(null);
      const [evidenceDetail, setEvidenceDetail] = React.useState(null);
      const [filterPriority, setFilterPriority] = React.useState("ALL");
      const [filterProgram, setFilterProgram] = React.useState("ALL");
      const [searchQuery, setSearchQuery] = React.useState("");
      const [apiStatus, setApiStatus] = React.useState("CHECKING");

      // Load data from FastAPI Backend on mount
      React.useEffect(() => {
        async function fetchData() {
          try {
            const resPat = await fetch(`${API_BASE}/patients`);
            if (resPat.ok) {
              const dataPat = await resPat.json();
              if (dataPat.patients && dataPat.patients.length > 0) {
                setPatients(dataPat.patients);
              }
              setApiStatus("ONLINE");
            } else {
              setApiStatus("OFFLINE_MOCK");
            }

            const resAlerts = await fetch(`${API_BASE}/alerts/technical`);
            if (resAlerts.ok) {
              const dataAlerts = await resAlerts.json();
              if (dataAlerts.alerts && dataAlerts.alerts.length > 0) {
                setTechnicalAlerts(dataAlerts.alerts);
              }
            }

            const resSig = await fetch(`${API_BASE}/signals`);
            if (resSig.ok) {
              const dataSig = await resSig.json();
              if (dataSig.signals && dataSig.signals.length > 0) {
                setSignals(dataSig.signals);
              }
            }
          } catch (e) {
            console.log("API offline, using mock data:", e);
            setApiStatus("OFFLINE_MOCK");
          }
        }
        fetchData();
      }, []);

      // Load Evidence Detail when signal selected
      const openEvidence = async (sigId, patientId) => {
        setSelectedSignalId(sigId);
        try {
          const res = await fetch(`${API_BASE}/signals/${sigId}/evidence`);
          if (res.ok) {
            const data = await res.json();
            setEvidenceDetail(data);
          } else {
            setEvidenceDetail(MOCK_EVIDENCE_MAP[sigId] || MOCK_EVIDENCE_MAP["SIG-000001"]);
          }
        } catch (e) {
          setEvidenceDetail(MOCK_EVIDENCE_MAP[sigId] || MOCK_EVIDENCE_MAP["SIG-000001"]);
        }
      };

      const filteredPatients = patients.filter(p => {
        if (filterPriority !== "ALL" && p.priority_level !== filterPriority) return false;
        if (filterProgram !== "ALL" && p.care_program !== filterProgram) return false;
        if (searchQuery && !p.patient_id.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });

      const kpiCritical = patients.filter(p => p.priority_level === "CRITICAL").length;
      const kpiHigh = patients.filter(p => p.priority_level === "HIGH").length;
      const kpiAlertsCount = technicalAlerts.length;

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header */}
          <header class="glass sticky top-0 z-40 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <i data-lucide="activity" class="w-6 h-6 text-white"></i>
              </div>
              <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  HealthSignal LATAM <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 font-semibold border border-brand-500/30">RISA V1.0</span>
                </h1>
                <p class="text-xs text-slate-400">Red Integrada de Salud Avanzada — Triaje y Linaje de Evidencia</p>
              </div>
            </div>

            {/* API Status Badge */}
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium glass">
                <span class={`w-2 h-2 rounded-full ${apiStatus === 'ONLINE' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span class="text-slate-300">Backend API: {apiStatus === 'ONLINE' ? 'Conectado (localhost:8000)' : 'Modo Autónomo (Mock Data)'}</span>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <main class="flex-1 p-6 space-y-6 max-w-7xl mx-auto w-full">
            {/* KPI Cards Header */}
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
                <div>
                  <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Pacientes Monitoreados</p>
                  <p class="text-3xl font-extrabold text-white mt-1">{patients.length}</p>
                  <p class="text-xs text-emerald-400 mt-1">100% Cobertura CDM</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center">
                  <i data-lucide="users" class="w-6 h-6"></i>
                </div>
              </div>

              <div class="glass-card p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-critical">
                <div>
                  <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Riesgo Crítico (CRITICAL)</p>
                  <p class="text-3xl font-extrabold text-critical mt-1">{kpiCritical}</p>
                  <p class="text-xs text-slate-400 mt-1">Requiere atención inmediata</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-red-500/10 text-critical flex items-center justify-center">
                  <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
              </div>

              <div class="glass-card p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-high">
                <div>
                  <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Riesgo Alto (HIGH)</p>
                  <p class="text-3xl font-extrabold text-high mt-1">{kpiHigh}</p>
                  <p class="text-xs text-slate-400 mt-1">Monitoreo estrecho activo</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-orange-500/10 text-high flex items-center justify-center">
                  <i data-lucide="shield-alert" class="w-6 h-6"></i>
                </div>
              </div>

              <div class="glass-card p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-amber-500">
                <div>
                  <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Incidencias de Red / Sensor</p>
                  <p class="text-3xl font-extrabold text-amber-400 mt-1">{kpiAlertsCount}</p>
                  <p class="text-xs text-slate-400 mt-1">Falla técnica (No clínico)</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center">
                  <i data-lucide="wifi-off" class="w-6 h-6"></i>
                </div>
              </div>
            </div>

            {/* Main Content Grid: Triage List + Technical Side Panel */}
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Triage Patient List (2 Cols) */}
              <div class="lg:col-span-2 space-y-4">
                <div class="glass p-5 rounded-2xl space-y-4">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="list-filter" class="w-5 h-5 text-brand-500"></i> Bandeja de Triaje Priorizada
                    </h2>

                    {/* Search & Filters */}
                    <div class="flex items-center gap-2">
                      <input 
                        type="text" 
                        placeholder="Buscar paciente ID..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        class="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 focus:outline-none focus:border-brand-500"
                      />
                      <select 
                        value={filterPriority}
                        onChange={(e) => setFilterPriority(e.target.value)}
                        class="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 focus:outline-none"
                      >
                        <option value="ALL">Todas las prioridades</option>
                        <option value="CRITICAL">CRITICAL</option>
                        <option value="HIGH">HIGH</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="LOW">LOW</option>
                      </select>
                    </div>
                  </div>

                  {/* Patient Table */}
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                      <thead class="bg-slate-900/60 uppercase text-slate-400 font-semibold border-b border-slate-800">
                        <tr>
                          <th class="p-3">Paciente ID</th>
                          <th class="p-3">Demografía</th>
                          <th class="p-3">Score de Riesgo</th>
                          <th class="p-3">Prioridad</th>
                          <th class="p-3">Programa</th>
                          <th class="p-3 text-right">Acción</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800/60">
                        {filteredPatients.map(pat => {
                          const badgeColor = 
                            pat.priority_level === 'CRITICAL' ? 'bg-red-500/20 text-red-400 border-red-500/40' :
                            pat.priority_level === 'HIGH' ? 'bg-orange-500/20 text-orange-400 border-orange-500/40' :
                            pat.priority_level === 'MEDIUM' ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500/40' :
                            'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';

                          return (
                            <tr key={pat.patient_id} class="hover:bg-slate-800/40 transition">
                              <td class="p-3 font-bold text-white flex items-center gap-2">
                                <span class={`w-2 h-2 rounded-full ${pat.status === 'CONNECTED' ? 'bg-emerald-500' : 'bg-slate-500'}`}></span>
                                {pat.patient_id}
                              </td>
                              <td class="p-3">{pat.age_years} años • {pat.sex_at_birth}</td>
                              <td class="p-3">
                                <div class="flex items-center gap-2">
                                  <div class="w-16 bg-slate-800 rounded-full h-2 overflow-hidden">
                                    <div class="bg-brand-500 h-2 rounded-full" style={{ width: `${pat.risk_score * 100}%` }}></div>
                                  </div>
                                  <span class="font-mono font-bold">{pat.risk_score.toFixed(2)}</span>
                                </div>
                              </td>
                              <td class="p-3">
                                <span class={`px-2.5 py-1 rounded-full text-[10px] font-extrabold border ${badgeColor}`}>
                                  {pat.priority_level}
                                </span>
                              </td>
                              <td class="p-3 font-mono text-slate-400">{pat.care_program}</td>
                              <td class="p-3 text-right">
                                <button 
                                  onClick={() => openEvidence("SIG-000001", pat.patient_id)}
                                  class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-lg text-xs transition shadow-sm"
                                >
                                  Ver Evidencias
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

              {/* Technical & Hardware Alerts Side Panel */}
              <div class="space-y-4">
                <div class="glass p-5 rounded-2xl space-y-4">
                  <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="hard-drive" class="w-5 h-5 text-amber-400"></i> Alertas Técnicas / Hardware
                  </h2>
                  <p class="text-xs text-slate-400">Diferenciación de desincronización de red vs. deterioro clínico fisiológico.</p>

                  <div class="space-y-3">
                    {technicalAlerts.map(alt => (
                      <div key={alt.alert_id} class="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800 flex flex-col gap-2">
                        <div class="flex items-center justify-between">
                          <span class="px-2 py-0.5 text-[10px] font-bold rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">
                            {alt.alert_type}
                          </span>
                          <span class="text-[10px] font-mono text-slate-500">{alt.timestamp}</span>
                        </div>
                        <p class="text-xs text-slate-300 font-medium">{alt.message}</p>
                        <div class="text-[10px] text-slate-400 flex items-center gap-3">
                          <span>Disp: <strong class="text-slate-200">{alt.device_id || 'N/A'}</strong></span>
                          <span>Pac: <strong class="text-slate-200">{alt.patient_id || 'N/A'}</strong></span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Signals Narrative Section */}
            <div class="glass p-6 rounded-2xl space-y-4">
              <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="file-text" class="w-5 h-5 text-indigo-400"></i> Resumen Explicativo de Alertas Activas
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {signals.map(sig => (
                  <div key={sig.signal_id} class="glass-card p-4 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="font-bold text-sm text-brand-400">{sig.signal_id} — {sig.patient_id}</span>
                      <span class="text-xs font-mono text-slate-400">{sig.decision_datetime}</span>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed">{sig.explanation}</p>
                    <div class="pt-2 flex justify-end">
                      <button 
                        onClick={() => openEvidence(sig.signal_id, sig.patient_id)}
                        class="text-xs font-semibold text-brand-400 hover:text-brand-300 underline"
                      >
                        Auditar Registros Fuente (Linaje) →
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>

          {/* Modal / Drawer of Evidence & SHAP Explainability */}
          {selectedSignalId && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end transition-opacity">
              <div class="w-full max-w-2xl bg-slate-900 border-l border-slate-800 h-full overflow-y-auto p-6 space-y-6 shadow-2xl flex flex-col justify-between">
                <div class="space-y-6">
                  {/* Drawer Header */}
                  <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <h2 class="text-xl font-extrabold text-white flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-6 h-6 text-brand-500"></i> Auditoría de Evidencias y Linaje
                      </h2>
                      <p class="text-xs text-slate-400 mt-1">Señal ID: <strong class="text-white">{selectedSignalId}</strong></p>
                    </div>
                    <button 
                      onClick={() => setSelectedSignalId(null)}
                      class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                    >
                      ✕
                    </button>
                  </div>

                  {/* SHAP Feature Importance */}
                  {evidenceDetail && (
                    <div class="space-y-3">
                      <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 text-brand-400"></i> Factores Determinantes (Valores SHAP)
                      </h3>
                      <div class="space-y-2">
                        {evidenceDetail.shap_contributions.map((feat, idx) => (
                          <div key={idx} class="space-y-1">
                            <div class="flex justify-between text-xs font-medium">
                              <span class="text-slate-300">{feat.feature_name} ({feat.description})</span>
                              <span class="text-brand-400 font-mono font-bold">+{(feat.importance * 100).toFixed(0)}%</span>
                            </div>
                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                              <div class="bg-gradient-to-r from-brand-500 to-indigo-500 h-2 rounded-full" style={{ width: `${feat.importance * 100}%` }}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Evidence Table (Anti-Leakage Audit) */}
                  {evidenceDetail && (
                    <div class="space-y-3">
                      <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="database" class="w-4 h-4 text-emerald-400"></i> Registros CDM de Soporte (Trazabilidad Fuente)
                      </h3>
                      <div class="border border-slate-800 rounded-xl overflow-hidden">
                        <table class="w-full text-left text-xs">
                          <thead class="bg-slate-950 text-slate-400 font-semibold uppercase border-b border-slate-800">
                            <tr>
                              <th class="p-2.5">Rol</th>
                              <th class="p-2.5">Archivo Fuente</th>
                              <th class="p-2.5">Record ID</th>
                              <th class="p-2.5">Variable</th>
                              <th class="p-2.5">T_event vs T_available</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-800/60 font-mono text-slate-300">
                            {evidenceDetail.evidences.map((ev, idx) => (
                              <tr key={idx} class="hover:bg-slate-800/40">
                                <td class="p-2.5">
                                  <span class={`px-2 py-0.5 text-[9px] font-bold rounded ${
                                    ev.evidence_role === 'PRIMARY' ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                                    ev.evidence_role === 'CONTEXT' ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' :
                                    'bg-slate-700/40 text-slate-300'
                                  }`}>
                                    {ev.evidence_role}
                                  </span>
                                </td>
                                <td class="p-2.5 text-slate-400">{ev.source_file}</td>
                                <td class="p-2.5 font-bold text-white">{ev.record_id}</td>
                                <td class="p-2.5 text-brand-400">{ev.variable_code}</td>
                                <td class="p-2.5 text-[10px] text-slate-400">
                                  {ev.event_datetime} <br/>
                                  <span class="text-emerald-400">✓ Avail: {ev.available_datetime}</span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      <p class="text-[11px] text-emerald-400 font-mono flex items-center gap-1">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Verificación Anti-Fuga Temporal: T_available ≤ T_decision cumplida al 100%.
                      </p>
                    </div>
                  )}
                </div>

                <div class="pt-6 border-t border-slate-800 flex justify-end">
                  <button 
                    onClick={() => setSelectedSignalId(null)}
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg"
                  >
                    Cerrar Auditoría
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Initialize Lucide Icons after render
    setTimeout(() => lucide.createIcons(), 200);
  </script>
</body>
</html>
